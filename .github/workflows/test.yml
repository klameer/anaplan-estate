name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "https://github.com/klameer/anaplan-grammar/archive/refs/heads/main.zip"
          pip install ".[web,dev]"
      - name: Test
        run: python -m pytest -q tests
      - name: Build the example report
        run: anaplan-estate examples/caldergate-estate --html estate.html --csv register.csv --title "Caldergate (fictional example)"
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: example-report
          path: |
            estate.html
            register.csv
